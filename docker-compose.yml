name: mspr813

services:
  etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    image: mspr813_etl_image
    container_name: mspr813_etl
    restart: unless-stopped
    depends_on:
      - postgres
    volumes:
      - ./etl/src:/app
    environment:
      - SPARK_HOME=/opt/spark-3.4.4-bin-hadoop3
      - PATH=$SPARK_HOME/bin:$PATH
      - PYTHONPATH=/app

  postgres:
    image: postgres:17.2
    container_name: mspr813_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mspr813
      POSTGRES_USER: mspr813
      POSTGRES_PASSWORD: s5t4v5
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mspr813"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pg-data:/var/lib/postgresql/data

  pgadmin4:
    build:
      context: ./pg_admin
      dockerfile: Dockerfile
    image: mspr813_pg_admin_image
    container_name: mspr813_pg_admin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: s5t4v5
    ports:
      - "7080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data: